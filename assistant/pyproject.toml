[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaditya Menon", email = "aaditya@sparker0i.me" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.78",
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
]

[project.scripts]
assistant = "assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
