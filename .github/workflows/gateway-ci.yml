name: gateway-ci
on:
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/gateway-ci.yml']
  pull_request:
    paths: ['gateway/**', '.github/workflows/gateway-ci.yml']
  workflow_dispatch: {}

defaults:
  run:
    working-directory: gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: true
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: gateway
          version: latest
      - run: go test ./... -race

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG - decode OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::186599549641:role/github-actions-deploy
          aws-region: us-east-1
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/gateway:latest
      - name: Run task on Fargate
        run: |
          aws ecs run-task \
            --cluster route-and-ship \
            --launch-type FARGATE \
            --task-definition gateway \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-5d19d072],securityGroups=[sg-5302cd26],assignPublicIp=ENABLED}"
